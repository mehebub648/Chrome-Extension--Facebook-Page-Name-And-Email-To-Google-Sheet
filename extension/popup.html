<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save Data</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: #121a33;
        --muted: #96a0c3;
        --line: #1f2a4d;
        --accent: #6ea8fe;
        --accent-2: #a7d3ff;
        --text: #eaf0ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 340px;
      }
      .wrap { padding: 14px; }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 16px;
        letter-spacing: 0.3px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 6px;
      }
      input {
        width: 100%;
        background: #0e1731;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        outline: none;
      }
      input::placeholder { color: #6a749a; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
      .btn {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #1a2a5a, #14234a);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn.primary {
        background: linear-gradient(180deg, var(--accent), #4a7fff);
        color: #07122a;
        border-color: #3a63cf;
      }
      .muted { color: var(--muted); font-size: 12px; }
      .spacer { height: 10px; }
      .footer {
        display: flex; justify-content: space-between; align-items: center; margin-top: 10px;
      }
      .status { font-size: 12px; min-height: 16px; color: var(--accent-2); }
      .divider { height: 1px; background: var(--line); margin: 10px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Save Facebook Page to Google Sheets</h1>
        <label for="endpoint">Apps Script URL (Deployment “exec”)</label>
        <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/DEPLOYMENT_ID/exec" />
        <label for="sheetId">Sheet ID</label>
        <input id="sheetId" type="text" placeholder="1abc... (from the URL)" />
        <label for="sheetName">Sheet Name</label>
        <input id="sheetName" type="text" placeholder="Sheet1" />
        <!-- Instruction to download a .gs file with apps script -->
        <br><br><a href="data:text/plain;charset=utf-8," download="script.gs" id="downloadLink">Download</a> Apps Script Code
        <!-- Instruction to download README.md -->
        <br><a href="data:text/plain;charset=utf-8," download="README.md" id="downloadReadme">Download</a> Instruction of Installation
        <div class="footer">
          <div class="status" id="status"></div>
          <button class="btn" id="saveSettings">Save Settings</button>
        </div>
        <div class="divider"></div>
        <div class="row">
          <div class="muted">Collect { name, email, link } from the page and POST to your endpoint.<br>
          <span style="color: var(--accent-2); font-weight: 600;">Shortcut: Ctrl+Shift+S (⌘+Shift+S on Mac)</span></div>
          <button class="btn primary" id="doSave">Save Data</button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
